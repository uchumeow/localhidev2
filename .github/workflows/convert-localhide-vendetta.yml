name: Convert LocalHide to Vendetta

on:
  push:
    paths:
      - '.github/workflows/convert-localhide-vendetta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert bundle
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('builds/localhide/index.js')
          old = path.read_text()
          suffix = '\nvar plugin = { default: definePlugin(LocalHide.plugin) };\n'
          if not old.endswith(suffix):
              raise SystemExit('Unexpected existing LocalHide bundle format')
          runtime = old[:-len(suffix)]

          shim = '''var __lhActionSheet = vendetta.metro.findByProps("openLazy", "hideActionSheet");
          var bunny = {
            metro: vendetta.metro,
            api: { patcher: vendetta.patcher },
            ui: {
              toasts: vendetta.ui.toasts,
              alerts: vendetta.ui.alerts,
              assets: vendetta.ui.assets,
              navigation: vendetta.metro.common.navigation,
              sheets: {
                showSheet: function (key, component, props) {
                  if (!__lhActionSheet || typeof __lhActionSheet.openLazy !== "function") return;
                  var lazy = component && typeof component.then === "function"
                    ? component
                    : Promise.resolve({ default: component });
                  return __lhActionSheet.openLazy(lazy, key, props || {});
                },
                hideSheet: function (key) {
                  return __lhActionSheet && __lhActionSheet.hideActionSheet
                    ? __lhActionSheet.hideActionSheet(key)
                    : undefined;
                }
              }
            },
            plugin: {
              createStorage: function () { return vendetta.plugin.storage; },
              logger: vendetta.logger || console
            }
          };
          var definePlugin = function (plugin) { return plugin; };'''

          bundle = f'''(function () {{
            "use strict";
          {shim}
          {runtime}
          return {{
            onLoad: function () {{ return LocalHide.plugin.start(); }},
            onUnload: function () {{ return LocalHide.plugin.stop(); }},
            settings: LocalHide.SettingsComponent
          }};
          }})()'''

          actual = hashlib.sha256(bundle.encode()).hexdigest()
          if not bundle.startswith('(function () {') or 'onLoad: function' not in bundle:
              raise SystemExit('invalid Vendetta wrapper')
          path.write_text(bundle)
          import json
          manifest_path = Path('builds/localhide/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          manifest['hash'] = actual
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n')
          print('Vendetta bundle verified:', len(bundle.encode()), actual)
      - name: Commit converted bundle
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/localhide/index.js builds/localhide/manifest.json
          git commit -m 'Convert LocalHide bundle to Vendetta runtime'
          git push
