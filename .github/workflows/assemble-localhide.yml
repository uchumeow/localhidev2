name: Assemble LocalHide bundle

on:
  push:
    paths:
      - '.github/workflows/assemble-localhide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble exact plugin bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/localhide
          cat .localhide-upload/part-* > builds/localhide/index.js
          test "$(wc -c < builds/localhide/index.js)" -eq 62528
          echo '553aa8c7b651181e09fc780012963c38263f06784d974d4e69257a0fa272d544  builds/localhide/index.js' | sha256sum -c -

      - name: Commit assembled bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add builds/localhide/index.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Add LocalHide compiled plugin bundle'
          git push
